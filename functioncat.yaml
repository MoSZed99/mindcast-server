system: 1.0.0
info:
  name: mindcast-server
  vars:
    NODE_ENV:
      description: "应用运行环境，如 development 或 production。"
    HEROKU_API_KEY:
      description: "Heroku 平台的 API Key，用于部署和管理应用。"
    MONGO_URI:
      description: "MongoDB 数据库的连接 URI。"
    JWT_SECRET:
      description: "用于生成 JWT 的密钥。"
envs:
  dev:
    branch: dev
  prod:
    branch: main
routes:
  main_env: prod
  main_app: server
auths:
  heroku:
    type: api_key
    envs:
      dev:
        in: header
        name: HEROKU-API-KEY
        value: ${{vars.HEROKU_API_KEY}}
      prod:
        in: header
        name: HEROKU-API-KEY
        value: ${{vars.HEROKU_API_KEY}}
apps:
  server:
    type: web_api
    envs:
      dev:
        build:
          root_path: ./
          script: |
            npm install
            npm run lint
            npm run test:coveralls
        provision:
          type: nodejs18x
          root_path: ./
          start_command: node index.js
          timeout: 120
          vars:
            - NODE_ENV
            - HEROKU_API_KEY
            - MONGO_URI
            - JWT_SECRET
      prod:
        build:
          root_path: ./
          script: |
            npm install
            npm run lint
            npm run test:coveralls
        provision:
          type: nodejs18x
          root_path: ./
          start_command: node index.js
          timeout: 120
          vars:
            - NODE_ENV
            - HEROKU_API_KEY
            - MONGO_URI
            - JWT_SECRET
services:
  database:
    type: kv_store
    envs:
      dev:
        provision:
          type: kv_store_v1
          namespaces:
            - devdata
      prod:
        provision:
          type: kv_store_v1
          namespaces:
            - appdata
